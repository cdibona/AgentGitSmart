# Adopter template — copy to .github/workflows/agentcache.yml.
# Generates refs/agent-cache/<sha> on every push to main.
#
# What this does:
#   1. Checks out your repo with full history (needed for the blobless bundle).
#   2. Installs the published agentcache package via pip.
#   3. Runs `agentcache-generate` to build manifest + symbols + bundle and
#      store them as an orphan commit under refs/agent-cache/<commit-sha>.
#   4. Pushes the side ref back so agents can fetch it directly.
#   5. Uploads the blobless bootstrap bundle as a workflow artifact.
#
# Pushing refs/agent-cache/* does NOT re-trigger this workflow because it
# only listens on branches: [main] — so there is no infinite loop.
#
# After copying, customise:
#   - The concurrency group name (replace "agentcache-" with something unique).
#   - The bundle artifact retention-days if you want a different window.
#   - The python-version if your repo requires something other than 3.11.

name: AgentCache generate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentcache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the blobless bundle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install universal-ctags (enables the symbol index)
        run: sudo apt-get update && sudo apt-get install -y universal-ctags

      - name: Install agentcache
        run: |
          python -m pip install --upgrade pip
          pip install "agentcache @ git+https://github.com/cdibona/AgentCache@main"

      - name: Generate the agent-cache for HEAD
        id: gen
        run: |
          agentcache-generate --repo . --commit HEAD --bundle-dir _bundles | tee gen.out
          REF=$(grep '::AGENTCACHE_REF::' gen.out | sed 's/.*:://')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Publish the side ref (refs/agent-cache/<commit>)
        continue-on-error: true   # some hosts restrict custom ref namespaces
        run: |
          REF="${{ steps.gen.outputs.ref }}"
          echo "Pushing $REF"
          git push --force origin "$REF:$REF"

      - name: Upload cache artifacts (bundle)
        uses: actions/upload-artifact@v4
        with:
          name: agentcache-${{ github.sha }}
          path: |
            _bundles/*.bundle
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## agentcache generated for \`${{ github.sha }}\`"
            echo ""
            grep -E 'manifest|symbols|cache_ref|bundle' gen.out || true
            echo ""
            echo "Agents can cold-start against this commit — see the repo AGENTS.md."
          } >> "$GITHUB_STEP_SUMMARY"
