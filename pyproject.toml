[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcache"
version = "0.5.0"
description = "Server-side per-commit agent knowledge cache for disposable agent VMs"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pygit2>=1.15",
    "Flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
harness = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aiofiles>=23",
]

[project.scripts]
agentcache-generate  = "agentcache.generate:main"
agentcache-service   = "agentcache.service:main"
agentcache-hook      = "agentcache.hook:main"
agentcache-uninstall = "agentcache.uninstall:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcache*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
markers      = [
    "slow: end-to-end tests that start subprocesses (daemon/proxy/service); run by default",
]
