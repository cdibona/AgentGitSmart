[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgitsmart"
version = "0.7.0"
description = "Server-side per-commit agent knowledge cache for disposable agent VMs"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pygit2>=1.15",
    "Flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
harness = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aiofiles>=23",
]

[project.scripts]
agentgitsmart-generate  = "agentgitsmart.generate:main"
agentgitsmart-service   = "agentgitsmart.service:main"
agentgitsmart-hook      = "agentgitsmart.hook:main"
agentgitsmart-uninstall = "agentgitsmart.uninstall:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentgitsmart*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
markers      = [
    "slow: end-to-end tests that start subprocesses (daemon/proxy/service); run by default",
]
