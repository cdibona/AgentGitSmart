name: agentcache

# Dogfooding: PackCache uses agentcache on itself.  GitHub doesn't run
# server-side post-receive hooks, so we do the equivalent in CI — generate the
# per-commit agent-knowledge cache (manifest + symbols + bundle) and publish it
# so coding agents and Actions can cold-start against this repo without cloning
# all the blobs.
#
# Two publishing channels (we do both, belt-and-suspenders):
#   1. push refs/agent-cache/<commit>  — the canonical side ref agents fetch
#   2. upload manifest/symbols/bundle as a workflow artifact — always works,
#      even if a server restricts custom ref namespaces
#
# Pushing a non-branch ref does NOT re-trigger this workflow (it only listens
# on branches: [main]), so there is no recursion.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentcache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the blobless bundle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install universal-ctags (enables the symbol index)
        run: sudo apt-get update && sudo apt-get install -y universal-ctags

      - name: Install agentcache
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate the agent-cache for HEAD
        id: gen
        run: |
          python scripts/generate_agentcache.py --repo . --commit HEAD --bundle-dir _bundles | tee gen.out
          REF=$(grep '::AGENTCACHE_REF::' gen.out | sed 's/.*:://')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Publish the side ref (refs/agent-cache/<commit>)
        continue-on-error: true   # some hosts restrict custom ref namespaces
        run: |
          REF="${{ steps.gen.outputs.ref }}"
          echo "Pushing $REF"
          git push --force origin "$REF:$REF"

      - name: Upload cache artifacts (manifest, symbols, bundle)
        uses: actions/upload-artifact@v4
        with:
          name: agentcache-${{ github.sha }}
          path: |
            _bundles/*.bundle
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## agentcache generated for \`${{ github.sha }}\`"
            echo ""
            grep -E 'manifest|symbols|cache_ref|bundle' gen.out || true
            echo ""
            echo "Agents can cold-start against this commit — see the **🤖 If you've"
            echo "been sent by a human** section of the README."
          } >> "$GITHUB_STEP_SUMMARY"
